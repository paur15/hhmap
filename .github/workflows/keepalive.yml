name: Supabase wach halten

# Supabase pausiert kostenlose Projekte nach einer Woche ohne Nutzung.
# Diese Automatik ruft die Datenbank zweimal pro Woche kurz an.
# GitHub stoppt Zeitpläne in öffentlichen Repositories nach 60 Tagen ohne
# neue Commits; deshalb legt der zweite Schritt bei Bedarf einen kleinen
# Commit an (.github/keepalive.txt).

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Montag und Donnerstag, 06:17 UTC
  workflow_dispatch:          # zum Testen: Actions → "Supabase wach halten" → Run workflow

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        env:
          SUPABASE_URL: https://pdbmazwkujjwuscdjxsw.supabase.co
          SUPABASE_KEY: sb_publishable_DDWbN-dfiwH5JQEsNBuwZA_d33Oxs-0
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo

      - uses: actions/checkout@v4

      - name: Repository aktiv halten
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Letzter Commit vor $days Tagen"
          if [ "$days" -ge 45 ]; then
            date -u +%F > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "Keepalive"
            git push
          fi
